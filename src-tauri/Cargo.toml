[package]
name = "is-takip"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "is_takip_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-sql = { version = "2.3.2", features = ["sqlite"] }
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2.4.10"

[profile.release]
# macOS 27'in `ld` + Rust'in varsayılan `strip = "debuginfo"` birleşimi
# LINKEDIT'i bozuyor: üretilen proc-macro dylib'i `dlopen` edilemiyor
# ("mis-aligned LINKEDIT string pool", rust-lang/rust#157750). Sonuç olarak
# `sqlx_macros` yüklenemiyor ve release derlemesi iOS'ta da, masaüstünde de
# E0432 ile düşüyor. Sembolleri strip etmeden bırakmak bu hatanın işe yaramaz
# bir sonucu oluyor; simgeleri Rust tarafında ayrıca kullanmıyoruz.
strip = "none"

